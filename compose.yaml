services:
  postgres:
    image: postgres:17
    container_name: incidentops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: incidentops

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U incidentops -d incidentops
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
